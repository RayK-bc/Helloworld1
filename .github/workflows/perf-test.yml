name: Automated Performance Test (Python)

on: 
    workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載 GitHub Repo 程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境 (替換原本的 .NET)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 可填寫你使用的 Python 版本，如 3.10 / 3.11 / 3.12

      - name: 3. 安裝 Python 套件並用 Uvicorn 啟動 FastAPI
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install fastapi uvicorn requests

          # 加上 --app-dir . 確保 Uvicorn 能夠正確找到 app.main:app
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir . > app.log 2>&1 &

          # 等待最多 15 秒，確保 8000 Port 真的活著
          echo "Waiting for FastAPI to start..."
          for i in {1..15}; do
            if curl -s http://localhost:8000/api/v1/ping?host=127.0.0.1 > /dev/null; then
              echo "FastAPI is UP!"
              break
            fi
            sleep 1
          done

          # 如果 startup 失敗，印出 app.log 睇下係咩錯
          if ! curl -s http://localhost:8000/api/v1/ping?host=127.0.0.1 > /dev/null; then
            echo "--- FastAPI Failed to Start. Showing app.log: ---"
            cat app.log
            exit 1
          fi

      - name: 4. 執行 k6 壓測腳本
        uses: grafana/k6-action@v0.3.1
        with:
          filename: loadtest.js
         

      - name: 5. 上傳 HTML 壓測報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: summary.html